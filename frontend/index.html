<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ludicrous Arena: Spectator</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    /* An id rule like #adminbar{display:inline-flex} outranks the UA [hidden]{display:none},
       which would leak the admin controls to spectators. Force hidden to win everywhere. */
    [hidden] { display: none !important; }
    body { margin: 0; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
           background: #07090d; color: #cdd6e4; overflow: hidden; }
    #scene { position: fixed; inset: 0; }
    #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 16px;
           align-items: center; padding: 10px 14px; background: linear-gradient(#0b0e14ee, #0b0e1400);
           pointer-events: none; }
    #hud .brandwrap { display: inline-flex; align-items: center; gap: 9px; }
    #hud .logo { height: 26px; width: 26px; display: block; }
    #hud .brand { font-weight: 700; letter-spacing: .5px; color: #7cc4ff; }
    #hud select, #hud button { pointer-events: auto; background: #121826; color: #cdd6e4;
           border: 1px solid #243049; border-radius: 6px; padding: 5px 8px; font: inherit; }
    #reset { background: #2a1418; color: #ff9a9a; border-color: #5a2730; }
    #reset:hover { background: #3a1a20; }
    #adminbar { display: inline-flex; gap: 6px; align-items: center; pointer-events: auto; }
    #adminbar .pill { font-size: 10px; letter-spacing: 1px; color: #ffb14a; border: 1px solid #5a4520;
           background: #2a2210; border-radius: 4px; padding: 2px 6px; }
    #hud button[disabled] { opacity: .4; cursor: default; }
    #status { margin-left: auto; color: #6b7790; }
    #scoreboard { position: fixed; top: 52px; right: 14px; min-width: 210px; max-width: 320px;
           max-height: calc(100vh - 66px); overflow-y: auto;
           background: #0b0e14cc; border: 1px solid #1c2538; border-radius: 8px; padding: 10px 12px; }
    #scoreboard h3 { margin: 0 0 6px; font-size: 12px; color: #6b7790; text-transform: uppercase; letter-spacing: 1px; }
    /* Header: the win condition and the current round, never paired as a comparable "N / M". */
    #scoreboard .sb-sub { font-size: 11px; color: #9cc4ff; margin: 0 0 2px; }
    #scoreboard .sb-sub b { color: #cfe2ff; }
    #scoreboard .muted { font-size: 11px; color: #6b7790; }
    #scoreboard .section { font-size: 11px; color: #6b7790; text-transform: uppercase; letter-spacing: 1px;
           margin: 10px 0 4px; border-top: 1px solid #1c2538; padding-top: 7px; }
    #scoreboard .legend { font-size: 11px; color: #7c89a3; margin: 0 0 5px; }
    /* Generic score rows (deathmatch / lockdown / trading_desk) and shared bits. */
    #scoreboard .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
    #scoreboard .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    #scoreboard .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #scoreboard .who.gone { opacity: .5; }
    /* Match-progress rows: name, round-win count, and a bar of rounds-to-win segments. */
    #scoreboard .prow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    #scoreboard .prow .who { flex: 1; min-width: 0; }
    #scoreboard .winnum { color: #ffd27c; font-weight: 700; min-width: 14px; text-align: right; }
    #scoreboard .bar { display: inline-flex; gap: 2px; flex-wrap: wrap; }
    #scoreboard .bar i { width: 7px; height: 11px; border-radius: 2px; background: #23304a; }
    #scoreboard .bar i.on { background: #ffd27c; }
    /* This-round rows: live state in plain words plus this round's score. */
    #scoreboard .trow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 0 0; }
    #scoreboard .trow .who { flex: 1; min-width: 0; }
    #scoreboard .tend { display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap; }
    #scoreboard .hearts { color: #ff6b7a; letter-spacing: 1px; }
    #scoreboard .tag { font-size: 10px; letter-spacing: .5px; color: #ffb14a; border: 1px solid #5a4520;
           background: #2a2210; border-radius: 4px; padding: 1px 5px; }
    #scoreboard .state { font-weight: 700; }
    #scoreboard .state.down { color: #7c89a3; }
    #scoreboard .state.fell { color: #b07cff; }
    /* Compact layout on phones: the board was eating half the screen. */
    @media (max-width: 600px) {
      #scoreboard { top: 40px; right: 7px; min-width: 0; max-width: 47vw; padding: 6px 8px;
             max-height: 60vh; overflow-y: auto; border-radius: 6px; }
      #scoreboard h3 { font-size: 10px; margin-bottom: 4px; }
      #scoreboard .sb-sub, #scoreboard .muted, #scoreboard .section,
      #scoreboard .row, #scoreboard .prow, #scoreboard .trow { font-size: 10px; }
      #scoreboard .section { margin: 6px 0 3px; padding-top: 5px; }
      #scoreboard .bar i { width: 6px; height: 9px; }
      #scoreboard .tag { font-size: 9px; padding: 0 4px; }
      #hint { display: none; }
    }
    #hint { position: fixed; left: 14px; bottom: 12px; color: #56607a;
            font-size: 12px; background: #0b0e14aa; border: 1px solid #1c2538;
            border-radius: 6px; padding: 5px 9px; pointer-events: none; }
    #banner { position: fixed; inset: 0; display: none; place-items: center; pointer-events: none; }
    #banner div { background: #0b0e14ee; border: 1px solid #2a3550; border-radius: 12px;
           padding: 24px 40px; font-size: 20px; text-align: center; }
    #banner .bsub { font-size: 13px; color: #9fb0cc; margin-top: 6px; border: 0; padding: 0; background: none; }
    #toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column;
           gap: 6px; align-items: flex-end; pointer-events: none; }
    #toasts .toast { background: #0b0e14ee; border: 1px solid #243049; border-left: 3px solid #7cc4ff;
           border-radius: 6px; padding: 7px 12px; font-size: 13px; color: #cdd6e4;
           opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
    #toasts .toast.show { opacity: 1; transform: none; }
    #toasts .toast.leave { border-left-color: #ff7c7c; }
  </style>
  <style>
    /* Broadcast-style vignette: darkens the corners to frame the action. It sits above the
       WebGL canvas but below the HUD (raised here), and never takes pointer events. */
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(4,7,12,0.62) 100%); }
    #hud, #scoreboard, #hint, #toasts, #banner { z-index: 10; }
    /* PAUSED overlay: shown by default while the arena is offline (API kill switch off,
       so Tablestore/FC cost ~$0). It covers everything so it is seen immediately, even
       with the API down. To RESUME: re-enable the API (api-switch.auto.tfvars) and add
       hidden to <div id="paused"> (or delete it), then redeploy the frontend. */
    #paused { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 24px;
      background: radial-gradient(circle at 50% 38%, #16110a 0%, #06080e 68%); }
    #paused .pbox { max-width: 700px; }
    #paused .plogo { width: 88px; height: 88px; margin: 0 0 20px; }
    #paused h1 { margin: 0 0 12px; font-size: clamp(40px, 9vw, 96px); letter-spacing: 5px;
      color: #ffb14a; text-shadow: 0 0 34px rgba(255,140,40,.5); }
    #paused p { margin: 8px 0; font-size: clamp(16px, 3vw, 24px); color: #cdd6e4; }
    #paused .pask { margin-top: 22px; font-size: clamp(19px, 3.6vw, 30px); color: #9fe8ff; }
    #paused .pask b { color: #fff; }
  </style>
</head>
<body>
  <div id="paused" hidden>
    <div class="pbox">
      <img class="plogo" src="/logo.png" alt="" />
      <h1>GAME PAUSED</h1>
      <p>The arena is offline for now to save on running costs.</p>
      <p class="pask">Ask <b>Fares</b> if you'd like to play.</p>
    </div>
  </div>
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="hud">
    <span class="brandwrap"><img class="logo" src="/logo.png" alt="" /><span class="brand">LUDICROUS ARENA</span></span>
    <span id="adminbar" hidden>
      <span class="pill">ADMIN</span>
      <button id="start" title="Start the arena" hidden>start</button>
      <button id="enddraw" title="End the current bout as a draw and start the next">end current match</button>
      <button id="reset" title="Restart the arena at round 1 (scores wiped)">reset</button>
    </span>
    <span id="status">idle</span>
    <button id="sound" title="Toggle sound effects">&#128266;</button>
  </div>
  <div id="scoreboard" hidden>
    <h3 id="sbtitle">Scoreboard</h3><div id="scores"></div>
    <div id="healthwrap" hidden><h3 style="margin-top:12px">Health</h3><div id="health"></div></div>
  </div>
  <div id="hint">You are spectating &middot; agents play via the API &middot; drag to rotate &middot; scroll to zoom</div>
  <div id="toasts"></div>
  <div id="banner"><div id="bannerText"></div></div>

  <!-- three.js as an ES module from a pinned CDN; no build step, keeping the
       frontend buildless. -->
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
  </script>
  <script type="module" src="./js/viewer.js?v=art3"></script>
</body>
</html>
