[project]
name = "ludicrous-arena"
version = "0.1.0"
description = "Ludicrous Arena: API-controlled multiplayer game server with a three.js spectator view"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "mangum==0.19.0",
    "pydantic==2.10.4",
]

[project.optional-dependencies]
# uvicorn is only needed for local dev; the Lambda package omits it.
local = ["uvicorn[standard]==0.34.0"]
# boto3 is provided by the Lambda runtime; needed locally only for DynamoStore.
dynamo = ["boto3==1.35.90"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.34.0",
    "boto3>=1.35",
    "moto[dynamodb]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = ["integration: end-to-end tests against a running arena"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arena*"]
